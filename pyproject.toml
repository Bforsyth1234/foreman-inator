[project]
name = "foreman-inator"
version = "0.1.0"
description = "A GitHub App plus a local worker that routes labeled issues to the cheapest model likely to solve them."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brooks Forsyth" }]
requires-python = ">=3.12"
keywords = [
    "github-app",
    "coding-agent",
    "llm",
    "model-routing",
    "code-review",
    "ollama",
    "opencode",
]
# No "License ::" classifier: the SPDX `license` expression above replaces it (PEP 639).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
# fde-kit is not on PyPI (checked 2026-11-23). `[tool.uv.sources]` below points it at
# GitHub, but only uv reads that table, and only when building from this source tree or a
# git checkout: a built wheel says just `Requires-Dist: fde-kit`. So the package installs
# from GitHub today, not from PyPI. See docs/releasing.md ("The fde-kit problem").
dependencies = [
    "fde-kit",
    "httpx>=0.27",
    "keyring>=25",
    "pyjwt[crypto]>=2.8",
    "starlette>=0.40",
    "tomli-w>=1.0",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Bforsyth1234/foreman-inator"
Repository = "https://github.com/Bforsyth1234/foreman-inator"
Documentation = "https://github.com/Bforsyth1234/foreman-inator/tree/main/docs"
Issues = "https://github.com/Bforsyth1234/foreman-inator/issues"
Changelog = "https://github.com/Bforsyth1234/foreman-inator/releases"

[project.scripts]
foreman-inator = "foreman_inator.cli:app"
fman = "foreman_inator.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Parallel by default (pytest-xdist): one worker per CPU core. On a 16-core Mac
# -n 8..16 all run the suite in ~60-75 s (serial: ~7-8 min). For a serial run to
# debug, pass `-n 0` (or `-p no:xdist`: tests/conftest.py then accepts and ignores
# this `--numprocesses`, which is spelled long so a conftest may define it).
addopts = "-ra --numprocesses=auto"
norecursedirs = ["fixtures", "recordings"]
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.uv.sources]
fde-kit = { git = "https://github.com/Bforsyth1234/fde-kit" }
